version: '3.8'

services:
  taskpulse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskpulse-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - sqlite_data:/app/server/data

volumes:
  sqlite_data:
    driver: local
